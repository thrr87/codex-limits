name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-check:
    name: Artifact upload compatibility
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Prepare release files
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$artifacts"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/thrr87/codex-limits/releases/download/v0.3.0/Codex-Limits-0.3.0.zip \
            --output "$artifacts/Codex-Limits-0.3.0.zip"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/thrr87/codex-limits/releases/download/v0.3.0/appcast.xml \
            --output "$artifacts/appcast.xml"
          printf '%s\n' 'Codex Limits 0.3.0 artifact upload compatibility check.' > "$artifacts/Codex-Limits-0.3.0.md"
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Codex-Limits-0.3.0-upload-check
          path: |
            ${{ runner.temp }}/release-artifacts/Codex-Limits-0.3.0.zip
            ${{ runner.temp }}/release-artifacts/appcast.xml
            ${{ runner.temp }}/release-artifacts/Codex-Limits-0.3.0.md
          if-no-files-found: error
          retention-days: 1
  test:
    name: Swift tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tests
        run: swift test -c release
      - name: Check release validation and process cleanup
        run: |
          Scripts/validate-release.sh --self-test
          python3 Scripts/check-grok-exit.py
